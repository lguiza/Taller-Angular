<div class="container mt-3">
    <h1>Listado de Series</h1>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Canal</th>
          <th>Temporadas</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let serie of series">
          <td>{{ serie.id }}</td>
          <td>{{ serie.name }}</td>
          <td>{{ serie.channel }}</td>
          <td>{{ serie.seasons }}</td>
        </tr>
      </tbody>
    </table>
    <div class="alert alert-info text-center">
      <strong>Promedio de temporadas:</strong> {{ promedioTemporadas.toFixed(2) }}
    </div>
  </div>
